# Tests and releases of this repository. The KLayout-PEX Allure and coverage pages
# get their plugin results from klayout-pex's own CI, which runs these tests too.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash    # NOTE: required for windows poetry calls

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Source compatibility' || 'Published dependencies' }} ${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    env:
      KPEX_KLAYOUT_EXE: /nonexistent
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'

    steps:
    - uses: actions/checkout@v7

    # PR checks exercise the unreleased API without relabelling core's version.
    # Remove this path once core 0.10.0 is published and poetry.lock is refreshed.
    - name: Check out pinned core source for PR compatibility tests
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v7
      with:
        repository: iic-jku/klayout-pex
        ref: 8531325df71c5e5d62d376ca15a13a01ef5aa807
        path: output_core_source

    - name: "[🐍] Setup python ${{ matrix.python-version }}"
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: "[🐍] Install Poetry"
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: "[🐍] Check version"
      if: ${{ github.event.release }}
      run: |
        version=$(poetry version --short)
        if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
          echo "Release tag ('${{ github.event.release.tag_name }}') and poetry version ('v$version') do not match!"
          exit 1
        fi

    # NOTE: the gmsh wheel links against these
    - name: "Install gmsh's system libraries"
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes libgl1 libglu1-mesa libgomp1 libxcursor1 libxft2 libxinerama1 libxrender1

    - name: Install pinned source and PR test dependencies
      if: github.event_name == 'pull_request'
      run: |
        python -m pip install 'grpcio-tools>=1.81,<1.82' 'gmsh>=4.12' 'pytest>=9,<10' 'allure-pytest>=2.13.5'
        python - <<'PYTHON'
        import subprocess
        import sys
        import tomllib
        from pathlib import Path
        core = tomllib.loads(Path('output_core_source/pyproject.toml').read_text(encoding='utf-8'))
        subprocess.run([sys.executable, '-m', 'pip', 'install', *core['project']['dependencies']], check=True)
        PYTHON
        python -m grpc_tools.protoc \
          --proto_path=output_core_source/protos \
          --python_out=output_core_source/klayout_pex_protobuf \
          $(find output_core_source/protos -name '*.proto')
        python output_core_source/scripts/gen_tech_pb output_core_source/klayout_pex_protobuf
        python -m pip install ./output_core_source
        # Core retains its source version. This intentionally does not assert
        # that the plugin's >=0.10.0 release dependency can already be installed.
        python -m pip install --no-deps .

    - name: Run source compatibility tests
      if: github.event_name == 'pull_request'
      run: python -m pytest --color no -rA

    - name: Install published release dependencies
      if: github.event_name != 'pull_request'
      run: |
        poetry check --lock
        poetry install --no-interaction

    - name: Run release dependency tests
      if: github.event_name != 'pull_request'
      run: poetry run pytest --color no -rA

  build:
    name: Build distribution 📦s
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: "[🐍] Setup python"
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: "[🐍] Install Poetry"
      uses: snok/install-poetry@v1

    - name: "[🐍] Build wheel and source archives"
      run: poetry build --output dist

    # A klayout_pex_plugins/__init__.py would hide every other plugin's package
    - name: "[🐍] Verify the namespace package stays implicit"
      run: |
        if unzip -l dist/*.whl | grep -q ' klayout_pex_plugins/__init__.py$'; then
          echo "The wheel ships klayout_pex_plugins/__init__.py"
          exit 1
        fi

    - name: "[🐍] Store dist artifact"
      uses: actions/upload-artifact@v6
      with:
        name: python-dist
        path: dist
        retention-days: 7
        if-no-files-found: error

  # Trusted Publishing: register this repository, this workflow file and the
  # environment as a (pending) publisher of the project on TestPyPI and PyPI.
  # Publishing has to happen in this file; PyPI does not accept a reusable
  # workflow as the publisher.
  publish-test-pypi:
    name: Publish distribution 📦s to TestPyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true    # fails when the version was not bumped
    environment: testpypi
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish distribution 📦s to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python-dist
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
